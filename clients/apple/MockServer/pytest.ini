[pytest]
testpaths = tests
# The app runs need built apps and the simulator; ../build.sh apps-e2e selects them with -m apps. The real-server
# runs need the running orchestrator and a free GPU (they run models); ../build.sh real selects them.
addopts = -m "not apps and not real"
markers =
    slow: takes more than 30 s (keepalive)
    apps: runs the built Mac app and the iPhone app in the simulator
    real: talks to the real orchestrator at LV_REAL_URL (or a dry run against the mock with LV_REAL_URL=mock)
