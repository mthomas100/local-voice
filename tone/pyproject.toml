[project]
name = "local-voice-tone"
version = "0.1.0"
description = "local-voice's Tier-1 delivery hints (M5): pauses, pitch, energy, pace and fillers against a rolling personal baseline"
requires-python = ">=3.12,<3.13"
# CPU only, no model: numpy for framing and statistics, Praat (through Parselmouth) for pitch. Parselmouth (GPL-3.0)
# is a dependency, installed separately by pip/uv, not vendored; the `pyin` extra is a permissive alternative.
dependencies = [
    "numpy>=1.26",
    "praat-parselmouth>=0.4.5",
]

[project.optional-dependencies]
# The alternative pitch tracker (`f0 = "pyin"`): librosa's probabilistic YIN, ISC licence, slower, with a numba JIT
# warm-up on first use.
pyin = ["librosa>=0.11"]

[dependency-groups]
dev = ["pytest>=8", "librosa>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_voice_tone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["needs_say: synthesises speech with macOS `say` (cached under tone/.cache)"]
# librosa 1.0 warns that time_stretch's n_fft is unused; only the tests' slow-speech plant calls it.
filterwarnings = ["ignore::FutureWarning:librosa.*"]
